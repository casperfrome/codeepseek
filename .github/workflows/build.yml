name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # ---- Go control backend (mbcontrol.exe) ----
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false # stdlib-only module, no go.sum to cache

      - name: Go vet
        working-directory: control
        run: go vet ./...

      - name: Build mbcontrol.exe
        working-directory: control
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -o ../publish/mbcontrol.exe .

      # ---- C# WinForms launcher (MoonBridgeSwitcher.exe) ----
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish launcher (single-file, self-contained)
        run: dotnet publish launcher/MoonBridgeSwitcher.csproj -c Release -r win-x64 -o publish

      # ---- artifacts / release ----
      - name: Package release zip
        shell: pwsh
        run: |
          $zipRoot = Join-Path $PWD 'publish\zip-root'
          if (Test-Path $zipRoot) {
            Remove-Item -Recurse -Force $zipRoot
          }
          New-Item -ItemType Directory -Path $zipRoot | Out-Null

          Copy-Item publish\MoonBridgeSwitcher.exe $zipRoot
          Copy-Item publish\mbcontrol.exe $zipRoot
          Copy-Item README.md $zipRoot
          Copy-Item LICENSE $zipRoot

          Compress-Archive -Path (Join-Path $zipRoot '*') -DestinationPath publish\codeepseek-win-x64.zip -Force

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: codeepseek-win-x64
          path: publish/codeepseek-win-x64.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: publish/codeepseek-win-x64.zip
