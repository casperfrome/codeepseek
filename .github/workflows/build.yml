name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore src/MoonBridgeSwitcher.csproj

      - name: Build
        run: dotnet build src/MoonBridgeSwitcher.csproj -c Release --no-restore

      - name: Publish (single-file, self-contained)
        run: dotnet publish src/MoonBridgeSwitcher.csproj -c Release -r win-x64 -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoonBridgeSwitcher-win-x64
          path: publish/MoonBridgeSwitcher.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/MoonBridgeSwitcher.exe
